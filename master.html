<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velki.Com - Master Agent</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<style>

.page-wrap{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:35px 15px 50px;
}

.page-title{
    text-align:center;
    font-family:Georgia,serif;
    font-size:40px;
    font-weight:400;
    margin:20px 0 12px;
}

.page-subtitle{
    text-align:center;
    font-size:20px;
    font-weight:700;
    margin-bottom:30px;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 18px;
    background:#111;
    color:#fff;
    text-decoration:none;
    border-radius:6px;
    font-weight:700;
}

.page-card{
    margin-top:25px;
    border:1px solid #ddd;
    border-radius:9px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.list-head{
    padding:18px;
    text-align:center;
    background:#f1f1f1;
    border-bottom:1px solid #ddd;
    font-size:21px;
    font-weight:800;
}

#masterList{
    width:100%;
}

.master-row{
    display:grid;
    grid-template-columns:18% 30% 35% 17%;
    min-height:135px;
    align-items:center;
    padding:10px 5px;
    border-bottom:1px solid #ddd;
}

.master-row:nth-child(even){
    background:#eee;
}

.cell{
    font-size:16px;
    font-weight:700;
    overflow-wrap:anywhere;
}

.cell.center{
    text-align:center;
}

.cell a{
    color:#111;
}

.phone a{
    text-decoration:underline;
}

.check{
    display:inline-flex;
    width:22px;
    height:22px;
    align-items:center;
    justify-content:center;
    background:#66b65d;
    color:#fff;
    border-radius:4px;
    margin-left:3px;
}

.empty{
    text-align:center;
    padding:35px 15px;
    font-weight:700;
}

</style>
</head>

<body>

<header class="top-logo-area">

<a href="index.html">

<img src="logo.png"
     alt="Velki.Com"
     class="main-logo">

</a>

<div class="site-name">
Velki.Com
</div>

</header>


<div class="page-wrap">

<a href="index.html" class="back-btn">
<i class="fa-solid fa-arrow-left"></i>
হোম
</a>


<h1 class="page-title">
Master Agent List
</h1>

<div class="page-subtitle">
মাস্টার এজেন্ট লিস্ট
</div>


<div class="page-card">

<div class="list-head">
ALL MASTER AGENT
</div>

<div id="masterList"></div>

</div>

</div>


<script>

const KEY = "velki_agents_v2";

const defaults = [

{
id:"106",
type:"master",
typeName:"MASTER",
phone:"+855968888888",
brands:["VELKI","9XBET"],
status:"active"
}

];


function load(){

let data = localStorage.getItem(KEY);

try{

return data
? JSON.parse(data)
: defaults;

}catch(e){

return defaults;

}

}


function render(){

const list =
document.getElementById("masterList");

const agents = load();

const filtered =
agents.filter(a =>
a.type === "master" &&
(!a.status || a.status === "active")
);

if(!filtered.length){

list.innerHTML =
`<div class="empty">
কোনো Master Agent পাওয়া যায়নি।
</div>`;

return;

}


list.innerHTML = "";

filtered.forEach(agent => {

const brands =
Array.isArray(agent.brands)
? agent.brands
: [];

const brandHTML =
brands.map(b => `
<div>
<a href="#">${escapeHTML(b)}</a>
<span class="check">✓</span>
</div>
`).join("");

const row =
document.createElement("div");

row.className="master-row";

row.innerHTML=`

<div class="cell center">
<a href="#">${escapeHTML(agent.id)}</a>
</div>

<div class="cell">
MASTER
</div>

<div class="cell">
${brandHTML}
</div>

<div class="cell phone">
<a href="tel:${escapeHTML(agent.phone)}">
${escapeHTML(agent.phone)}
</a>
</div>

`;

list.appendChild(row);

});

}


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


render();


window.addEventListener("storage",render);

</script>

</body>
</html>
