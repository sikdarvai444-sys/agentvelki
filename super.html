<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Velki.Com - Super Agent</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="top-logo-area">

<a href="index.html">

<img src="logo.png"
class="main-logo"
alt="Velki.Com">

</a>

<div class="site-name">
Velki.Com
</div>

</section>


<section class="find-section">

<h1>
Super Agent List
</h1>

<h2>
সকল সুপার এজেন্ট লিস্ট
</h2>

<div class="search-card">

<div class="form-group">

<label>
Agent ID:
</label>

<input
id="superSearch"
type="text"
placeholder="Agent ID লিখুন">

</div>

<button
class="submit-btn"
onclick="searchSuper()">

Search

</button>

<div id="result"></div>

</div>

</section>


<section class="agent-list-section">

<h2>
ALL SUPER AGENT
</h2>

<div class="filter-box">

<button
class="filter-btn active">
সকল সুপার
</button>

</div>

<div id="agentListContainer"></div>

</section>


<footer>

<img src="logo.png"
class="footer-logo-image">

<p>
© 2026 Velki.Com
</p>

<a href="index.html"
class="admin-link">

Home

</a>

</footer>


<script>

const KEY="velki_agents_v2";


function getAgents(){

try{

const saved=
localStorage.getItem(KEY);

if(saved){

return JSON.parse(saved);

}

}catch(e){}

return [];

}


function esc(v){

return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function render(){

const container=
document.getElementById(
"agentListContainer"
);

const agents=getAgents()
.filter(a =>
a.type==="super" &&
(!a.status || a.status==="active")
);


container.innerHTML="";


if(!agents.length){

container.innerHTML=
`<div class="no-agent">
কোনো Super Agent পাওয়া যায়নি।
</div>`;

return;

}


agents.forEach(agent=>{

const row=
document.createElement("div");

row.className="agent-row";

const brands=
Array.isArray(agent.brands)
?agent.brands
:[];

row.innerHTML=`

<div class="agent-id-box">

<a href="#">
${esc(agent.id)}
</a>

</div>

<div class="agent-info">

<div class="agent-type">
SUPER
</div>

${brands.map(b=>`

<div>

<a class="agent-brand"
href="#">

${esc(b)}

</a>

<span class="agent-check">
✓
</span>

</div>

`).join("")}

</div>

<div class="agent-phone">

<a href="tel:${esc(agent.phone)}">

${esc(agent.phone)}

</a>

</div>

<div class="agent-action">

<a href="#"
onclick="complaint('${esc(agent.id)}');return false;">

অভিযোগ

</a>

<a href="tel:${esc(agent.phone)}">

যোগ

</a>

</div>

`;

container.appendChild(row);

});

}


function searchSuper(){

const id=
document.getElementById(
"superSearch"
).value.trim().toLowerCase();

const result=
document.getElementById("result");

if(!id){

result.innerHTML=
`<div class="no-agent">
Agent ID লিখুন।
</div>`;

return;

}


const agent=
getAgents().find(a=>
String(a.id).toLowerCase()===id &&
a.type==="super"
);


if(!agent){

result.innerHTML=
`<div class="no-agent">
এই Super Agent ID পাওয়া যায়নি।
</div>`;

return;

}


result.innerHTML=`

<div class="no-agent"
style="margin-top:15px">

Agent পাওয়া গেছে ✓

<br><br>

<strong>ID:</strong>
${esc(agent.id)}

<br>

<strong>Phone:</strong>
${esc(agent.phone)}

</div>

`;

}


function complaint(id){

alert(
"Agent ID: "+id+
"\n\nঅভিযোগের জন্য Customer Service-এর সাথে যোগাযোগ করুন।"
);

}


render();

window.addEventListener(
"storage",
render
);

</script>

</body>
</html>
