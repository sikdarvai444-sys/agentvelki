<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Manager Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{font-family:"Noto Sans Bengali";background:#f1f1f1;margin:0;padding:15px}
.header{background:#292929;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:800;margin-bottom:15px}
.box{background:#fff;padding:15px;border-radius:5px;margin-bottom:15px}
input,button{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:4px;font-size:15px;font-family:"Noto Sans Bengali"}
button{background:#24d866;color:#fff;border:none;font-weight:700;cursor:pointer}
button.del{background:#d32f2f}
table{width:100%;background:#fff;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#353535;color:#fff}
</style>
</head>
<body>
<div class="header">Contact Manager Admin Panel</div>

<div class="box">
  <h3>নতুন Contact Add/Edit করুন</h3>
  <input type="hidden" id="editIndex">
  <input type="text" id="name" placeholder="নাম">
  <input type="text" id="id" placeholder="ID নাম্বার">
  <input type="text" id="phone" placeholder="ফোন নাম্বার">
  <input type="text" id="note" placeholder="নোট">
  <button onclick="saveData()">Save করুন</button>
</div>

<div class="box">
  <h3>সকল Contact List</h3>
  <input type="text" id="search" onkeyup="loadData()" placeholder="Search by ID বা নাম...">
  <table id="dataTable">
    <tr><th>ID</th><th>নাম</th><th>ফোন</th><th>Action</th></tr>
  </table>
</div>

<script>
let data = JSON.parse(localStorage.getItem('contacts')) || [];

function saveData(){
  const name = document.getElementById('name').value;
  const id = document.getElementById('id').value;
  const phone = document.getElementById('phone').value;
  const note = document.getElementById('note').value;
  const editIndex = document.getElementById('editIndex').value;

  if(!name ||!id) return alert("নাম এবং ID দিতে হবে");

  const obj = {name,id,phone,note};

  if(editIndex === ""){
    data.push(obj);
  } else {
    data[editIndex] = obj;
    document.getElementById('editIndex').value = "";
  }

  localStorage.setItem('contacts', JSON.stringify(data));
  clearForm();
  loadData();
}

function loadData(){
  const search = document.getElementById('search').value.toLowerCase();
  let table = "<tr><th>ID</th><th>নাম</th><th>ফোন</th><th>Action</th></tr>";

  data.filter(item => item.id.toLowerCase().includes(search) || item.name.toLowerCase().includes(search))
 .forEach((item,index)=>{
    table += `<tr>
      <td>${item.id}</td>
      <td>${item.name}</td>
      <td>${item.phone}</td>
      <td>
        <button onclick="editData(${index})">Edit</button>
        <button class="del" onclick="deleteData(${index})">Delete</button>
      </td>
    </tr>`;
  });
  document.getElementById('dataTable').innerHTML = table;
}

function editData(index){
  document.getElementById('editIndex').value = index;
  document.getElementById('name').value = data[index].name;
  document.getElementById('id').value = data[index].id;
  document.getElementById('phone').value = data[index].phone;
  document.getElementById('note').value = data[index].note;
}

function deleteData(index){
  if(confirm("Delete করবেন?")){
    data.splice(index,1);
    localStorage.setItem('contacts', JSON.stringify(data));
    loadData();
  }
}

function clearForm(){
  document.getElementById('name').value = "";
  document.getElementById('id').value = "";
  document.getElementById('phone').value = "";
  document.getElementById('note').value = "";
}

loadData();
</script>
</body>
</html>
