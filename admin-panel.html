<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0">

<meta name="theme-color"
      content="#111111">

<title>Velki.Com - Admin Panel</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


body{

    background:#f3f3f3;

    color:#111;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    overflow-x:hidden;

}


button,
input,
select,
textarea{

    font-family:inherit;

}


/* =====================================================
   HEADER
===================================================== */

.admin-header{

    position:sticky;

    top:0;

    z-index:1000;

    min-height:70px;

    background:#111;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:10px 18px;

}


.header-left{

    display:flex;

    align-items:center;

    gap:12px;

}


.header-logo{

    width:48px;

    height:48px;

    object-fit:contain;

    background:#fff;

    border-radius:7px;

}


.header-title{

    font-size:20px;

    font-weight:800;

}


.logout-btn{

    border:0;

    background:#fff;

    color:#111;

    padding:10px 14px;

    border-radius:6px;

    font-weight:700;

    cursor:pointer;

}


/* =====================================================
   MAIN
===================================================== */

.admin-main{

    width:100%;

    max-width:1100px;

    margin:auto;

    padding:20px 15px 60px;

}


/* =====================================================
   DASHBOARD CARDS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-bottom:20px;

}


.stat-card{

    background:#fff;

    border:1px solid #ddd;

    border-radius:9px;

    padding:18px;

}


.stat-card i{

    font-size:24px;

    margin-bottom:10px;

}


.stat-number{

    font-size:28px;

    font-weight:800;

}


.stat-label{

    color:#666;

    font-size:14px;

    margin-top:4px;

}


/* =====================================================
   PANEL
===================================================== */

.panel{

    background:#fff;

    border:1px solid #ddd;

    border-radius:10px;

    margin-bottom:20px;

    overflow:hidden;

}


.panel-title{

    padding:16px 18px;

    background:#f1f1f1;

    border-bottom:1px solid #ddd;

    font-size:19px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.panel-body{

    padding:18px;

}


/* =====================================================
   FORM
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

}


.form-group{

    display:flex;

    flex-direction:column;

    gap:7px;

}


.form-group.full{

    grid-column:1 / -1;

}


.form-group label{

    font-size:14px;

    font-weight:700;

    color:#555;

}


.form-group input,
.form-group select{

    width:100%;

    height:48px;

    border:1px solid #ccc;

    border-radius:6px;

    padding:0 13px;

    outline:none;

    font-size:16px;

    background:#fff;

}


.form-group input:focus,
.form-group select:focus{

    border-color:#111;

}


.brand-input{

    display:flex;

    gap:7px;

}


.brand-input input{

    flex:1;

}


.small-btn{

    min-width:48px;

    border:0;

    border-radius:6px;

    background:#111;

    color:#fff;

    cursor:pointer;

}


.brands-list{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:8px;

}


.brand-tag{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:6px 9px;

    background:#eee;

    border-radius:5px;

    font-size:13px;

    font-weight:700;

}


.brand-remove{

    border:0;

    background:transparent;

    cursor:pointer;

    font-weight:800;

}


.form-actions{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:18px;

}


.btn{

    min-height:46px;

    padding:0 18px;

    border:0;

    border-radius:6px;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

}


.btn-primary{

    background:#111;

    color:#fff;

}


.btn-secondary{

    background:#e8e8e8;

    color:#111;

}


.btn-danger{

    background:#d00000;

    color:#fff;

}


.btn-success{

    background:#168a35;

    color:#fff;

}


/* =====================================================
   SEARCH
===================================================== */

.toolbar{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

}


.toolbar input{

    flex:1;

    min-width:200px;

    height:46px;

    border:1px solid #ccc;

    border-radius:6px;

    padding:0 13px;

    font-size:15px;

    outline:none;

}


.toolbar select{

    height:46px;

    border:1px solid #ccc;

    border-radius:6px;

    padding:0 12px;

    background:#fff;

}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{

    width:100%;

    overflow-x:auto;

}


table{

    width:100%;

    min-width:850px;

    border-collapse:collapse;

}


th,
td{

    border-bottom:1px solid #ddd;

    padding:11px 9px;

    text-align:left;

    font-size:14px;

}


th{

    background:#111;

    color:#fff;

    font-weight:800;

}


tr:nth-child(even){

    background:#f6f6f6;

}


.type-badge{

    display:inline-block;

    padding:5px 8px;

    border-radius:4px;

    background:#e8e8e8;

    font-size:12px;

    font-weight:800;

}


.status-badge{

    display:inline-block;

    padding:5px 8px;

    border-radius:4px;

    font-size:12px;

    font-weight:800;

}


.status-active{

    background:#dff5e4;

    color:#16752c;

}


.status-disabled{

    background:#f8dddd;

    color:#a00000;

}


.action-buttons{

    display:flex;

    gap:5px;

    flex-wrap:wrap;

}


.action-buttons button{

    border:0;

    padding:7px 9px;

    border-radius:4px;

    cursor:pointer;

    font-weight:700;

}


.edit-btn{

    background:#ddd;

}


.delete-btn{

    background:#d00000;

    color:#fff;

}


.toggle-btn{

    background:#111;

    color:#fff;

}


/* =====================================================
   IMPORT / EXPORT
===================================================== */

.data-actions{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}


.hidden-file{

    display:none;

}


/* =====================================================
   NOTICE
===================================================== */

.notice{

    padding:12px 14px;

    background:#f1f1f1;

    border:1px solid #ddd;

    border-radius:6px;

    margin-bottom:15px;

    font-size:14px;

    line-height:1.7;

}


.success-message{

    color:#168a35;

    font-weight:700;

}


.error-message{

    color:#d00000;

    font-weight:700;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:750px){

    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }


    .form-grid{

        grid-template-columns:1fr;

    }


    .form-group.full{

        grid-column:auto;

    }


    .admin-header{

        padding:9px 12px;

    }


    .header-title{

        font-size:17px;

    }


    .logout-btn{

        padding:9px 10px;

    }

}


@media(max-width:420px){

    .stats{

        gap:8px;

    }


    .stat-card{

        padding:13px;

    }


    .stat-number{

        font-size:23px;

    }


    .panel-body{

        padding:13px;

    }


    .form-actions .btn{

        width:100%;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="admin-header">


<div class="header-left">

<img
    src="logo.png"
    class="header-logo"
    alt="Velki">

<div class="header-title">
Velki.Com Admin
</div>

</div>


<button
    class="logout-btn"
    id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>


</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="admin-main">


<!-- STATS -->

<section class="stats">


<div class="stat-card">

<i class="fa-solid fa-users"></i>

<div
    class="stat-number"
    id="totalCount">

0

</div>

<div class="stat-label">
মোট এজেন্ট
</div>

</div>


<div class="stat-card">

<i class="fa-solid fa-crown"></i>

<div
    class="stat-number"
    id="masterCount">

0

</div>

<div class="stat-label">
Master
</div>

</div>


<div class="stat-card">

<i class="fa-solid fa-star"></i>

<div
    class="stat-number"
    id="superCount">

0

</div>

<div class="stat-label">
Super
</div>

</div>


<div class="stat-card">

<i class="fa-solid fa-user-shield"></i>

<div
    class="stat-number"
    id="adminCount">

0

</div>

<div class="stat-label">
Sub Admin
</div>

</div>


</section>


<!-- =====================================================
     ADD / EDIT
===================================================== -->

<section class="panel">


<div class="panel-title">

<span id="formTitle">
নতুন Agent যোগ করুন
</span>

</div>


<div class="panel-body">


<div
    id="formMessage"
    class="notice"
    style="display:none;">
</div>


<form id="agentForm">


<input
    type="hidden"
    id="editOriginalId">


<div class="form-grid">


<!-- ID -->

<div class="form-group">

<label>
Agent ID *
</label>

<input
    type="text"
    id="agentId"
    placeholder="যেমন: 108"
    autocomplete="off"
    required>

</div>


<!-- TYPE -->

<div class="form-group">

<label>
Agent Type *
</label>

<select id="agentType">

<option value="master">
Master Agent
</option>

<option value="super">
Super Agent
</option>

<option value="admin">
Sub Admin
</option>

</select>

</div>


<!-- PHONE -->

<div class="form-group">

<label>
Phone Number *
</label>

<input
    type="text"
    id="agentPhone"
    placeholder="+855xxxxxxxxx"
    autocomplete="off"
    required>

</div>


<!-- STATUS -->

<div class="form-group">

<label>
Status
</label>

<select id="agentStatus">

<option value="active">
Active
</option>

<option value="disabled">
Disabled
</option>

</select>

</div>


<!-- BRAND -->

<div class="form-group full">

<label>
Brand যোগ করুন
</label>


<div class="brand-input">

<input
    type="text"
    id="brandInput"
    placeholder="যেমন: VELKI">

<button
    type="button"
    class="small-btn"
    id="addBrandBtn">

<i class="fa-solid fa-plus"></i>

</button>

</div>


<div
    class="brands-list"
    id="brandsList">
</div>

</div>


</div>


<div class="form-actions">


<button
    type="submit"
    class="btn btn-primary">

<i class="fa-solid fa-floppy-disk"></i>

&nbsp;

<span id="saveButtonText">
Save Agent
</span>

</button>


<button
    type="button"
    class="btn btn-secondary"
    id="clearFormBtn">

<i class="fa-solid fa-rotate-left"></i>

&nbsp;

Clear

</button>


</div>


</form>

</div>

</section>


<!-- =====================================================
     SEARCH / FILTER
===================================================== -->

<section class="panel">


<div class="panel-title">

Agent Management

</div>


<div class="panel-body">


<div class="toolbar">


<input
    type="search"
    id="tableSearch"
    placeholder="Agent ID / Phone / Brand দিয়ে খুঁজুন...">


<select id="tableFilter">

<option value="all">
সকল
</option>

<option value="master">
Master
</option>

<option value="super">
Super
</option>

<option value="admin">
Sub Admin
</option>

<option value="active">
Active
</option>

<option value="disabled">
Disabled
</option>

</select>


</div>


</div>

</section>


<!-- =====================================================
     AGENT TABLE
===================================================== -->

<section class="panel">


<div class="panel-title">

<span>
Agent List
</span>

<span
    id="visibleCount"
    style="font-size:13px;color:#666;">
0
</span>

</div>


<div class="table-wrap">


<table>


<thead>

<tr>

<th>
ID
</th>

<th>
Type
</th>

<th>
Phone
</th>

<th>
Brand
</th>

<th>
Status
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody id="agentTableBody">
</tbody>


</table>


</div>


</section>


<!-- =====================================================
     DATA BACKUP
===================================================== -->

<section class="panel">


<div class="panel-title">

Data Backup & Restore

</div>


<div class="panel-body">


<div class="notice">

<strong>Backup:</strong>
Agent data JSON ফাইলে সংরক্ষণ করুন।

<br>

<strong>Restore:</strong>
আগের JSON ফাইল আবার Import করতে পারবেন।

</div>


<div class="data-actions">


<button
    class="btn btn-primary"
    id="exportBtn">

<i class="fa-solid fa-download"></i>

&nbsp;

Export JSON

</button>


<label
    class="btn btn-secondary">

<i class="fa-solid fa-upload"></i>

&nbsp;

Import JSON

<input
    type="file"
    id="importFile"
    class="hidden-file"
    accept=".json,application/json">

</label>


<button
    class="btn btn-danger"
    id="resetDataBtn">

<i class="fa-solid fa-trash"></i>

&nbsp;

Reset Default

</button>


</div>

</div>

</section>


<!-- =====================================================
     PIN CHANGE
===================================================== -->

<section class="panel">


<div class="panel-title">

Admin PIN পরিবর্তন

</div>


<div class="panel-body">


<div class="form-grid">


<div class="form-group">

<label>
নতুন PIN
</label>

<input
    type="password"
    id="newPin"
    inputmode="numeric"
    placeholder="নতুন PIN">

</div>


<div class="form-group">

<label>
PIN Confirm
</label>

<input
    type="password"
    id="confirmPin"
    inputmode="numeric"
    placeholder="আবার PIN লিখুন">

</div>

</div>


<div class="form-actions">

<button
    class="btn btn-primary"
    id="changePinBtn">

<i class="fa-solid fa-key"></i>

&nbsp;

Change PIN

</button>

</div>


</div>

</section>


</main>


<script src="admin.js"></script>


</body>

</html>
