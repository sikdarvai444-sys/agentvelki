<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Velki.Com - Search Agent</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="top-logo-area">

<a href="index.html">

<img src="logo.png"
class="main-logo"
alt="Velki.Com">

</a>

<div class="site-name">
Velki.Com
</div>

</section>


<section class="find-section">

<h1>
Find Agent
</h1>

<h2>
এজেন্টের তথ্য খুঁজুন
</h2>


<div class="search-card">

<div class="form-group">

<label>
Agent Type:
</label>

<select id="type">

<option value="all">
সকল এজেন্ট
</option>

<option value="master">
মাস্টার এজেন্ট
</option>

<option value="super">
সুপার এজেন্ট
</option>

<option value="admin">
সাব এডমিন
</option>

</select>

</div>


<div class="form-group">

<label>
Agent ID:
</label>

<input
id="id"
type="text"
placeholder="Agent ID লিখুন"
autocomplete="off">

</div>


<button
class="submit-btn"
onclick="findAgent()">

Search

</button>


<div id="result"></div>

</div>

</section>


<footer>

<img src="logo.png"
class="footer-logo-image">

<p>
© 2026 Velki.Com
</p>

<a href="index.html"
class="admin-link">
Home
</a>

</footer>


<script>

const KEY="velki_agents_v2";


function esc(v){

return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function getAgents(){

try{

return JSON.parse(
localStorage.getItem(KEY)
)||[];

}catch(e){

return [];

}

}


function findAgent(){

const id=
document.getElementById("id")
.value.trim().toLowerCase();

const type=
document.getElementById("type")
.value;

const result=
document.getElementById("result");


if(!id){

result.innerHTML=
`<div class="no-agent">
Agent ID লিখুন।
</div>`;

return;

}


const agent=
getAgents().find(a=>

String(a.id)
.toLowerCase()===id &&

(type==="all" || a.type===type) &&

(!a.status || a.status==="active")

);


if(!agent){

result.innerHTML=
`<div class="no-agent">
এই Agent ID পাওয়া যায়নি।
</div>`;

return;

}


const brands=
Array.isArray(agent.brands)
?agent.brands
:[];


result.innerHTML=`

<div class="agent-row"
style="margin-top:18px">

<div class="agent-id-box">
${esc(agent.id)}
</div>


<div class="agent-info">

<div class="agent-type">
${esc(agent.typeName || agent.type)}
</div>

${brands.map(b=>`

<div>

<a class="agent-brand"
href="#">

${esc(b)}

</a>

<span class="agent-check">
✓
</span>

</div>

`).join("")}

</div>


<div class="agent-phone">

<a href="tel:${esc(agent.phone)}">
${esc(agent.phone)}
</a>

</div>


<div class="agent-action">

<a href="tel:${esc(agent.phone)}">
যোগ
</a>

</div>

</div>

`;

}


document
.getElementById("id")
.addEventListener("keydown",e=>{

if(e.key==="Enter"){

findAgent();

}

});

</script>

</body>
</html>
