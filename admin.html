<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0">

<meta name="theme-color"
      content="#111111">

<title>Velki.Com - Admin Login</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:#f3f3f3;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.login-box{

    width:100%;

    max-width:420px;

    background:#fff;

    border:1px solid #ddd;

    border-radius:14px;

    padding:35px 28px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.10);

    text-align:center;

}


.login-logo{

    width:130px;

    height:130px;

    object-fit:contain;

    margin-bottom:10px;

}


.login-title{

    font-size:28px;

    font-weight:800;

    margin-bottom:5px;

}


.login-subtitle{

    color:#666;

    font-size:15px;

    margin-bottom:30px;

}


.input-box{

    position:relative;

    margin-bottom:18px;

}


.input-box i{

    position:absolute;

    left:16px;

    top:50%;

    transform:translateY(-50%);

    color:#777;

}


.input-box input{

    width:100%;

    height:55px;

    border:1px solid #ccc;

    border-radius:7px;

    padding:0 48px;

    font-size:17px;

    outline:none;

}


.input-box input:focus{

    border-color:#111;

}


.login-btn{

    width:100%;

    height:55px;

    border:0;

    border-radius:7px;

    background:#111;

    color:#fff;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

}


.login-btn:active{

    transform:scale(.98);

}


.error{

    min-height:24px;

    margin-top:12px;

    color:#d00000;

    font-size:14px;

    font-weight:700;

}


.back-home{

    display:inline-block;

    margin-top:20px;

    color:#111;

    text-decoration:underline;

    font-size:14px;

}

</style>

</head>


<body>


<div class="login-box">


<img
    src="logo.png"
    class="login-logo"
    alt="Velki.Com">


<div class="login-title">

Velki.Com

</div>


<div class="login-subtitle">

Administrator Login

</div>


<form id="loginForm">


<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
    type="password"
    id="adminPin"
    placeholder="Admin PIN"
    inputmode="numeric"
    autocomplete="off"
    required>

</div>


<button
    type="submit"
    class="login-btn">

<i class="fa-solid fa-right-to-bracket"></i>

&nbsp; Login

</button>


</form>


<div
    id="error"
    class="error">
</div>


<a
    href="index.html"
    class="back-home">

<i class="fa-solid fa-arrow-left"></i>

&nbsp; Back to Home

</a>


</div>


<script>

"use strict";


/* =====================================================
   ADMIN PIN
=====================================================

   প্রথমবারের PIN:
   123456

   চাইলে নিচের PIN পরিবর্তন করবেন।

===================================================== */

const ADMIN_PIN_KEY =
    "velki_admin_pin_v2";


const DEFAULT_PIN =
    "123456";


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const pin =
            document
            .getElementById("adminPin")
            .value
            .trim();


        const error =
            document
            .getElementById("error");


        const savedPin =
            localStorage.getItem(
                ADMIN_PIN_KEY
            ) || DEFAULT_PIN;


        if(pin !== savedPin){

            error.textContent =
                "ভুল PIN! আবার চেষ্টা করুন।";


            document
            .getElementById("adminPin")
            .value = "";


            document
            .getElementById("adminPin")
            .focus();


            return;

        }


        /* Login session */

        sessionStorage.setItem(
            "velki_admin_logged_in",
            "yes"
        );


        sessionStorage.setItem(
            "velki_admin_login_time",
            Date.now().toString()
        );


        window.location.href =
            "admin-panel.html";

    }
);

</script>

</body>

</html>
